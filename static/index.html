<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vehicle Listings Assistant</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #1a1d23;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --bubble-bot: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121317;
      --panel: #1a1c22;
      --border: #2a2d35;
      --text: #e7e9ee;
      --muted: #9aa0ab;
      --accent: #5b8def;
      --accent-text: #0b1220;
      --bubble-bot: #23262e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 48px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 16px;
    margin: 0;
  }
  header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.45;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: var(--accent-text);
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border-bottom-left-radius: 4px;
  }
  .msg.pending { opacity: 0.6; }
  .msg.error { border: 1px solid #dc2626; }
  form {
    display: flex;
    gap: 8px;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); }
  button {
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🚗 Vehicle Listings Assistant</h1>
      <p>Ask about vehicles in the AutoTrader sample dataset — answers are grounded in real listings.</p>
    </header>
    <div id="log"></div>
    <form id="form">
      <input id="input" type="text" placeholder="e.g. Show me low-mileage SUVs under $30k" autocomplete="off" />
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    let sessionId = localStorage.getItem('rag_session_id') || null;

    function addMessage(text, role) {
      const el = document.createElement('div');
      el.className = `msg ${role}`;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    addMessage(
      "Hi! I can answer questions about the vehicle listings in this dataset — makes/models, prices, mileage, features, and more. What are you looking for?",
      'bot'
    );

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addMessage(text, 'user');
      sendBtn.disabled = true;
      const pending = addMessage('Thinking…', 'bot pending');

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || `HTTP ${res.status}`);
        }
        const data = await res.json();
        sessionId = data.session_id;
        localStorage.setItem('rag_session_id', sessionId);
        pending.textContent = data.reply;
        pending.classList.remove('pending');
      } catch (err) {
        pending.textContent = `Error: ${err.message}`;
        pending.classList.remove('pending');
        pending.classList.add('error');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
